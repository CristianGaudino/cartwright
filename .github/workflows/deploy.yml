name: Deploy (Cloudflare Workers)

# Every merge to main deploys to production. To roll back, run it from the Actions tab with an older
# tag or commit. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  schedule:
    - cron: '0 6 * * 1' # weekly, so the demo's sold cars keep their dates (npm run stock:redate)
  workflow_dispatch:
    inputs:
      ref:
        description: 'A tag or commit to deploy (default: main)'
        required: false
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The demo deploy is not production: every page is noindex, the sitemap is empty and robots.txt only lets the
      # share-preview bots in. Set production only when this deploys the client's live domain (owner decision 1).
      APP_ENV: demo
      # Turnstile site key: public, inlined into the browser bundle at build. Its secret is a Worker secret.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAF3rGKbvV1v6bX8K
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run stock:redate
      - run: npm run lint
      - run: npm test
      # Runs before the new code is live, so only additive migrations are safe (scripts/check-migrations.sh). A failure stops the deploy.
      - name: Migrate the database
        run: npm run db:migrate
      - run: npx opennextjs-cloudflare build
      - run: npx wrangler deploy --var APP_COMMIT_SHA:${{ github.sha }} --var "APP_VERSION:$(git describe --tags --always)"
