name: Deploy (Cloudflare Workers)

# Production deploys a release, never a merge: release.yml calls this with its new tag, and merging to main deploys nothing.
# The weekly run (and Run workflow with the ref left empty) redeploys the latest release, so the demo's sold cars keep their dates.
# To roll back, run it from the Actions tab with an older tag, like v1.0.0. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets.
on:
  workflow_call:
    inputs:
      ref:
        description: 'The release tag to deploy'
        required: true
        type: string
  schedule:
    - cron: '0 6 * * 1' # weekly, so the demo's sold cars keep their dates (npm run stock:redate)
  workflow_dispatch:
    inputs:
      ref:
        description: 'A release tag to deploy, like v1.0.0 (empty: the latest release)'
        required: false
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Not from another branch picked in the Run workflow menu: it would run that branch's copy of this file with the production secrets
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The demo deploy is not production: every page is noindex, the sitemap is empty and robots.txt only lets the
      # share-preview bots in. Set production only when this deploys the client's live domain (owner decision 1).
      APP_ENV: demo
      # Turnstile site key: public, inlined into the browser bundle at build. Its secret is a Worker secret.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAF3rGKbvV1v6bX8K
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag, to find the latest
          fetch-depth: 0
      - name: Check out the release
        run: |
          ref="${REF:-$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)}"
          if [ -z "$ref" ]; then echo "No release yet. Run the Release workflow first."; exit 1; fi
          git checkout --detach "$ref"
        env:
          REF: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run stock:redate
      - run: npm run lint
      - run: npm test
      # Runs before the new code is live, so only additive migrations are safe (scripts/check-migrations.sh). A failure stops the deploy.
      - name: Migrate the database
        run: npm run db:migrate
      - run: npx opennextjs-cloudflare build
      - run: npx wrangler deploy --var "APP_COMMIT_SHA:$(git rev-parse HEAD)" --var "APP_VERSION:$(git describe --tags --always)"
