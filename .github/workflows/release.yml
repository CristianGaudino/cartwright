name: Release

# Cut by hand: Actions, Release, Run workflow, pick major, minor or patch. Tags the tip of main, publishes a
# GitHub release (notes are the merged pull requests). It does not deploy: merging to main does (deploy.yml).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'major: breaking or a big change · minor: new features · patch: fixes only'
        required: true
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - name: Work out the next version
        id: next
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            next=v1.0.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              major) next="v$((major + 1)).0.0" ;;
              minor) next="v$major.$((minor + 1)).0" ;;
              patch) next="v$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "Latest: ${latest:-none}, next: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
        env:
          BUMP: ${{ inputs.bump }}
      - name: Publish the release
        run: gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target main --title "$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
